<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的消費記錄</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Day.js for timezone and date math -->
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/plugin/utc.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/plugin/timezone.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/plugin/isBetween.js"></script>
    
    <!-- 隱藏 input type="number" 預設的上下調整按鈕 -->
    <style>
        /* Chrome, Safari, Edge, Opera */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        /* Firefox */
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-800">

    <!-- Auth Section -->
    <div id="auth-section" class="flex items-center justify-center min-h-screen">
        <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
            <h2 class="text-2xl font-bold mb-6 text-center text-blue-600">信用卡消費記錄系統</h2>
            <input type="email" id="email" placeholder="Email (電子信箱)" class="w-full mb-4 p-2 border rounded">
            <input type="password" id="password" placeholder="密碼" class="w-full mb-6 p-2 border rounded">
            <button onclick="login()" class="w-full bg-blue-500 text-white p-2 rounded hover:bg-blue-600 mb-2">登入</button>
            <button onclick="signup()" class="w-full bg-gray-200 text-gray-700 p-2 rounded hover:bg-gray-300">註冊新帳號</button>
            <p id="auth-msg" class="text-red-500 text-sm mt-4 text-center"></p>
        </div>
    </div>

    <!-- Main App Section -->
    <div id="app-section" class="hidden max-w-5xl mx-auto p-4">
        <div class="flex justify-between items-center mb-6 bg-white p-4 rounded shadow">
            <h1 class="text-xl md:text-2xl font-bold text-blue-600">我的消費記錄</h1>
            <button onclick="logout()" class="text-sm bg-red-500 text-white px-4 py-2 rounded">登出</button>
        </div>

        <!-- Navigation -->
        <div class="flex space-x-2 mb-6">
            <button onclick="switchTab('add')" id="tab-add" class="flex-1 py-2 rounded shadow bg-blue-500 text-white font-bold">新增消費</button>
            <button onclick="switchTab('stats')" id="tab-stats" class="flex-1 py-2 rounded shadow bg-white text-gray-700 font-bold hover:bg-gray-50">統計表</button>
        </div>

        <!-- Tab: Add Transaction -->
        <div id="view-add" class="bg-white p-6 rounded shadow">
            <h2 class="text-lg font-bold mb-4 border-b pb-2">新增刷卡消費</h2>
            <form id="tx-form" onsubmit="submitTransaction(event)">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <!-- 卡片選擇 -->
                    <div>
                        <label class="block text-sm font-bold mb-1">卡片名稱</label>
                        <div class="flex">
                            <select id="tx-card" required class="flex-1 p-2 border rounded-l"></select>
                            <button type="button" onclick="openModal('modal-cards')" class="bg-gray-200 px-3 rounded-r border border-l-0 hover:bg-gray-300">管理</button>
                        </div>
                    </div>
                    <!-- 日期 -->
                    <div>
                        <label class="block text-sm font-bold mb-1">消費日期</label>
                        <input type="date" id="tx-date" required class="w-full p-2 border rounded">
                    </div>
                    <!-- 金額 -->
                    <div>
                        <label class="block text-sm font-bold mb-1">消費金額 (新台幣)</label>
                        <input type="number" id="tx-amount" required step="1" min="0" placeholder="點此輸入整數" class="w-full p-2 border rounded">
                    </div>
                    <!-- 類別選擇 -->
                    <div>
                        <label class="block text-sm font-bold mb-1">消費地點</label>
                        <div class="flex">
                            <select id="tx-category" required class="flex-1 p-2 border rounded-l"></select>
                            <button type="button" onclick="openModal('modal-categories')" class="bg-gray-200 px-3 rounded-r border border-l-0 hover:bg-gray-300">管理</button>
                        </div>
                    </div>
                    <!-- 備註 -->
                    <div class="md:col-span-2">
                        <label class="block text-sm font-bold mb-1">備註</label>
                        <input type="text" id="tx-note" placeholder="選填" class="w-full p-2 border rounded">
                    </div>
                </div>
                <button type="submit" class="w-full bg-green-500 text-white font-bold p-3 rounded hover:bg-green-600">送出消費記錄</button>
            </form>
        </div>

        <!-- Tab: Statistics -->
        <div id="view-stats" class="hidden space-y-6">
            <div id="stats-container"></div>
        </div>
    </div>

    <!-- Modal: Manage Cards -->
    <div id="modal-cards" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-lg p-6 w-full max-w-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between mb-4"><h3 class="text-xl font-bold">管理卡片</h3><button onclick="closeModal('modal-cards')" class="text-gray-500 text-xl">&times;</button></div>
            <form onsubmit="saveCard(event)" class="bg-gray-50 p-4 rounded mb-6 border">
                <h4 id="c-form-title" class="font-bold mb-2">新增卡片</h4>
                <input type="hidden" id="c-id">
                <div class="grid grid-cols-2 gap-2 mb-2">
                    <input type="text" id="c-name" required placeholder="卡片名稱" class="p-2 border rounded">
                    <input type="text" id="c-num" placeholder="卡號 (選填)" class="p-2 border rounded">
                    <input type="number" id="c-sort" placeholder="排序 (數字小在前)" value="0" class="p-2 border rounded">
                    <input type="number" id="c-bill" required min="1" max="31" placeholder="結帳日 (1-31)" class="p-2 border rounded">
                    <input type="number" id="c-due" required min="1" max="31" placeholder="繳費截止日 (1-31)" class="p-2 border rounded">
                    <div>
                        <label class="text-xs text-gray-500">發卡日</label>
                        <input type="date" id="c-issue" required class="p-2 border rounded w-full">
                    </div>
                </div>
                <div class="flex space-x-2 mt-2">
                    <button type="submit" id="c-btn-submit" class="flex-1 bg-blue-500 text-white p-2 rounded hover:bg-blue-600">新增</button>
                    <button type="button" id="c-btn-cancel" onclick="resetCardForm()" class="hidden flex-1 bg-gray-300 text-gray-700 p-2 rounded hover:bg-gray-400">取消編輯</button>
                </div>
            </form>
            <div id="list-cards" class="space-y-2"></div>
        </div>
    </div>

    <!-- Modal: Manage Categories -->
    <div id="modal-categories" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-lg p-6 w-full max-w-md max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between mb-4"><h3 class="text-xl font-bold">管理消費地點</h3><button onclick="closeModal('modal-categories')" class="text-gray-500 text-xl">&times;</button></div>
            <form onsubmit="saveCategory(event)" class="bg-gray-50 p-4 rounded mb-6 border">
                <h4 id="cat-form-title" class="font-bold mb-2">新增地點/類別</h4>
                <input type="hidden" id="cat-id">
                <div class="flex space-x-2">
                    <input type="text" id="cat-name" required placeholder="類別名稱" class="flex-1 p-2 border rounded">
                    <input type="number" id="cat-sort" placeholder="排序" value="0" class="w-20 p-2 border rounded">
                </div>
                <div class="flex space-x-2 mt-3">
                    <button type="submit" id="cat-btn-submit" class="flex-1 bg-blue-500 text-white p-2 rounded hover:bg-blue-600">新增</button>
                    <button type="button" id="cat-btn-cancel" onclick="resetCategoryForm()" class="hidden flex-1 bg-gray-300 text-gray-700 p-2 rounded hover:bg-gray-400">取消編輯</button>
                </div>
            </form>
            <div id="list-categories" class="space-y-2"></div>
        </div>
    </div>

    <!-- Modal: View All Transactions for a Card -->
    <div id="modal-card-txs" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-lg p-6 w-full max-w-3xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 id="card-txs-title" class="text-xl font-bold text-blue-600">所有刷卡明細</h3>
                <button onclick="closeModal('modal-card-txs')" class="text-gray-500 text-2xl font-bold">&times;</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left">
                    <thead class="bg-gray-100 text-gray-600">
                        <tr>
                            <th class="p-2">日期</th>
                            <th class="p-2">類別</th>
                            <th class="p-2 text-right">金額</th>
                            <th class="p-2">備註</th>
                            <th class="p-2 text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody id="card-txs-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal: Edit Single Transaction -->
    <div id="modal-edit-tx" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-lg p-6 w-full max-w-lg max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold">編輯消費記錄</h3>
                <button onclick="closeModal('modal-edit-tx')" class="text-gray-500 text-2xl font-bold">&times;</button>
            </div>
            <form onsubmit="saveEditTransaction(event)">
                <input type="hidden" id="edit-tx-id">
                <div class="grid grid-cols-1 gap-4 mb-4">
                    <div>
                        <label class="block text-sm font-bold mb-1">卡片名稱</label>
                        <select id="edit-tx-card" required class="w-full p-2 border rounded"></select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-1">消費日期</label>
                        <input type="date" id="edit-tx-date" required class="w-full p-2 border rounded">
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-1">消費金額 (新台幣)</label>
                        <input type="number" id="edit-tx-amount" required step="1" min="0" placeholder="僅限整數" class="w-full p-2 border rounded">
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-1">消費地點</label>
                        <select id="edit-tx-category" required class="w-full p-2 border rounded"></select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-1">備註</label>
                        <input type="text" id="edit-tx-note" placeholder="選填" class="w-full p-2 border rounded">
                    </div>
                </div>
                <button type="submit" class="w-full bg-blue-500 text-white font-bold p-3 rounded hover:bg-blue-600">儲存修改</button>
            </form>
        </div>
    </div>

    <script>
        // Supabase Initialization
        const SUPABASE_URL = "https://nllzyoxyeycqjqaregxx.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5sbHp5b3h5ZXljcWpxYXJlZ3h4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzNTc2ODQsImV4cCI6MjA5NzkzMzY4NH0.l-LlBNKY57Gwv6VbT1LXEmTKG5V0kNe9veUXHHYAI2M";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Day.js Setup
        dayjs.extend(window.dayjs_plugin_utc);
        dayjs.extend(window.dayjs_plugin_timezone);
        dayjs.extend(window.dayjs_plugin_isBetween);
        dayjs.tz.setDefault("Asia/Taipei"); // 使用台北時間

        // State
        let cards = [];
        let categories = [];
        let currentDetailCardId = null;
        
        // --- 認證區塊 ---
        async function checkSession() {
            const { data } = await supabaseClient.auth.getSession();
            if (data.session) {
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('app-section').classList.remove('hidden');
                document.getElementById('tx-date').value = dayjs().tz().format('YYYY-MM-DD');
                fetchMasterData();
            } else {
                document.getElementById('auth-section').classList.remove('hidden');
                document.getElementById('app-section').classList.add('hidden');
            }
        }

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) document.getElementById('auth-msg').innerText = error.message;
            else checkSession();
        }

        async function signup() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { error } = await supabaseClient.auth.signUp({ email, password });
            if (error) document.getElementById('auth-msg').innerText = error.message;
            else document.getElementById('auth-msg').innerText = "註冊成功，請登入。";
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            checkSession();
        }

        // --- 介面控制 ---
        function switchTab(tab) {
            document.getElementById('view-add').classList.add('hidden');
            document.getElementById('view-stats').classList.add('hidden');
            document.getElementById('tab-add').classList.replace('bg-blue-500', 'bg-white');
            document.getElementById('tab-add').classList.replace('text-white', 'text-gray-700');
            document.getElementById('tab-stats').classList.replace('bg-blue-500', 'bg-white');
            document.getElementById('tab-stats').classList.replace('text-white', 'text-gray-700');

            document.getElementById(`view-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-${tab}`).classList.replace('bg-white', 'bg-blue-500');
            document.getElementById(`tab-${tab}`).classList.replace('text-gray-700', 'text-white');

            if(tab === 'stats') generateStats();
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        const formatMoney = (val) => new Intl.NumberFormat('zh-TW', { style: 'currency', currency: 'TWD', minimumFractionDigits: 0 }).format(val);

        // --- 資料抓取與管理 (CRUD) ---
        async function fetchMasterData() {
            const resCards = await supabaseClient.from('card_cards').select('*').order('sort_order', { ascending: true });
            cards = resCards.data || [];
            const resCats = await supabaseClient.from('card_categories').select('*').order('sort_order', { ascending: true });
            categories = resCats.data || [];
            
            updateDropdowns();
            renderCardList();
            renderCategoryList();
        }

        function updateDropdowns() {
            const optionsCards = cards.map(c => `<option value="${c.id}">${c.card_name} (${c.card_number || '無卡號'})</option>`).join('');
            document.getElementById('tx-card').innerHTML = optionsCards;
            document.getElementById('edit-tx-card').innerHTML = optionsCards;

            const optionsCats = categories.map(c => `<option value="${c.id}">${c.category_name}</option>`).join('');
            document.getElementById('tx-category').innerHTML = optionsCats;
            document.getElementById('edit-tx-category').innerHTML = optionsCats;
        }

        // --- 卡片管理 (新增/編輯/刪除) ---
        async function saveCard(e) {
            e.preventDefault();
            const id = document.getElementById('c-id').value;
            const data = {
                card_name: document.getElementById('c-name').value,
                card_number: document.getElementById('c-num').value,
                sort_order: parseInt(document.getElementById('c-sort').value || 0),
                billing_day: parseInt(document.getElementById('c-bill').value),
                payment_due_day: parseInt(document.getElementById('c-due').value),
                issue_date: document.getElementById('c-issue').value
            };

            if (id) {
                await supabaseClient.from('card_cards').update(data).eq('id', id);
            } else {
                await supabaseClient.from('card_cards').insert([data]);
            }

            resetCardForm();
            fetchMasterData();
        }

        function editCard(id) {
            const c = cards.find(item => item.id === id);
            if (!c) return;
            document.getElementById('c-id').value = c.id;
            document.getElementById('c-name').value = c.card_name;
            document.getElementById('c-num').value = c.card_number || '';
            document.getElementById('c-sort').value = c.sort_order;
            document.getElementById('c-bill').value = c.billing_day;
            document.getElementById('c-due').value = c.payment_due_day;
            document.getElementById('c-issue').value = c.issue_date;

            document.getElementById('c-form-title').innerText = "編輯卡片";
            document.getElementById('c-btn-submit').innerText = "儲存修改";
            document.getElementById('c-btn-cancel').classList.remove('hidden');
        }

        function resetCardForm() {
            document.getElementById('c-id').value = '';
            document.getElementById('c-name').value = '';
            document.getElementById('c-num').value = '';
            document.getElementById('c-sort').value = '0';
            document.getElementById('c-bill').value = '';
            document.getElementById('c-due').value = '';
            document.getElementById('c-issue').value = '';

            document.getElementById('c-form-title').innerText = "新增卡片";
            document.getElementById('c-btn-submit').innerText = "新增";
            document.getElementById('c-btn-cancel').classList.add('hidden');
        }

        async function deleteCard(id) {
            if(confirm('確定刪除？相關消費紀錄亦受影響。')) {
                await supabaseClient.from('card_cards').delete().eq('id', id);
                fetchMasterData();
            }
        }

        function renderCardList() {
            const list = document.getElementById('list-cards');
            list.innerHTML = cards.map(c => `
                <div class="flex justify-between items-center p-2 border-b text-sm">
                    <div>
                        <span class="font-bold">${c.card_name}</span> (${c.card_number || '無號碼'})<br>
                        <span class="text-xs text-gray-500">結帳:${c.billing_day}號 | 繳費:${c.payment_due_day}號 | 發卡:${c.issue_date}</span>
                    </div>
                    <div class="space-x-2">
                        <button onclick="editCard('${c.id}')" class="text-blue-500 hover:underline">編輯</button>
                        <button onclick="deleteCard('${c.id}')" class="text-red-500 hover:underline">刪除</button>
                    </div>
                </div>
            `).join('');
        }

        // --- 類別管理 (新增/編輯/刪除) ---
        async function saveCategory(e) {
            e.preventDefault();
            const id = document.getElementById('cat-id').value;
            const data = {
                category_name: document.getElementById('cat-name').value,
                sort_order: parseInt(document.getElementById('cat-sort').value || 0)
            };

            if (id) {
                await supabaseClient.from('card_categories').update(data).eq('id', id);
            } else {
                await supabaseClient.from('card_categories').insert([data]);
            }

            resetCategoryForm();
            fetchMasterData();
        }

        function editCategory(id) {
            const cat = categories.find(item => item.id === id);
            if (!cat) return;
            document.getElementById('cat-id').value = cat.id;
            document.getElementById('cat-name').value = cat.category_name;
            document.getElementById('cat-sort').value = cat.sort_order;

            document.getElementById('cat-form-title').innerText = "編輯地點/類別";
            document.getElementById('cat-btn-submit').innerText = "儲存修改";
            document.getElementById('cat-btn-cancel').classList.remove('hidden');
        }

        function resetCategoryForm() {
            document.getElementById('cat-id').value = '';
            document.getElementById('cat-name').value = '';
            document.getElementById('cat-sort').value = '0';

            document.getElementById('cat-form-title').innerText = "新增地點/類別";
            document.getElementById('cat-btn-submit').innerText = "新增";
            document.getElementById('cat-btn-cancel').classList.add('hidden');
        }

        async function deleteCategory(id) {
            if(confirm('確定刪除此類別？')) {
                await supabaseClient.from('card_categories').delete().eq('id', id);
                fetchMasterData();
            }
        }

        function renderCategoryList() {
            const list = document.getElementById('list-categories');
            list.innerHTML = categories.map(c => `
                <div class="flex justify-between p-2 border-b text-sm">
                    <span>${c.category_name} (排序:${c.sort_order})</span>
                    <div class="space-x-2">
                        <button onclick="editCategory('${c.id}')" class="text-blue-500 hover:underline">編輯</button>
                        <button onclick="deleteCategory('${c.id}')" class="text-red-500 hover:underline">刪除</button>
                    </div>
                </div>
            `).join('');
        }

        // --- 新增消費 ---
        async function submitTransaction(e) {
            e.preventDefault();
            const data = {
                card_id: document.getElementById('tx-card').value,
                category_id: document.getElementById('tx-category').value,
                transaction_date: document.getElementById('tx-date').value,
                amount: Math.floor(parseInt(document.getElementById('tx-amount').value)), // 強制整數
                note: document.getElementById('tx-note').value
            };
            
            const { error } = await supabaseClient.from('card_transactions').insert([data]);
            if (error) alert("錯誤: " + error.message);
            else {
                //alert("消費記錄新增成功！");
                e.target.reset();
                document.getElementById('tx-date').value = dayjs().tz().format('YYYY-MM-DD');
            }
        }

        // --- 查看卡片所有歷史明細 & 編輯/刪除消費記錄 ---
        async function showCardAllTransactions(cardId) {
            currentDetailCardId = cardId;
            const card = cards.find(c => c.id === cardId);
            document.getElementById('card-txs-title').innerText = `${card ? card.card_name : ''} - 所有歷史刷卡明細`;

            // 日期由舊到新
            const { data: txs, error } = await supabaseClient.from('card_transactions')
                .select(`*, card_categories(category_name)`)
                .eq('card_id', cardId)
                .order('transaction_date', { ascending: true });

            const tbody = document.getElementById('card-txs-tbody');
            if (error || !txs || txs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-gray-400">查無歷史消費記錄</td></tr>';
            } else {
                tbody.innerHTML = txs.map(t => `
                    <tr class="border-b hover:bg-gray-50">
                        <td class="p-2">${t.transaction_date}</td>
                        <td class="p-2">${t.card_categories ? t.card_categories.category_name : '未分類'}</td>
                        <td class="p-2 text-right font-bold text-red-500">${formatMoney(t.amount)}</td>
                        <td class="p-2 text-gray-500">${t.note || ''}</td>
                        <td class="p-2 text-center space-x-2">
                            <button onclick="openEditTxModal('${t.id}', '${t.card_id}', '${t.category_id || ''}', '${t.transaction_date}', ${t.amount}, '${t.note || ''}')" class="text-blue-500 hover:underline">編輯</button>
                            <button onclick="deleteTransaction('${t.id}')" class="text-red-500 hover:underline">刪除</button>
                        </td>
                    </tr>
                `).join('');
            }

            openModal('modal-card-txs');
        }

        function openEditTxModal(id, cardId, categoryId, date, amount, note) {
            document.getElementById('edit-tx-id').value = id;
            document.getElementById('edit-tx-card').value = cardId;
            document.getElementById('edit-tx-category').value = categoryId;
            document.getElementById('edit-tx-date').value = date;
            document.getElementById('edit-tx-amount').value = amount;
            document.getElementById('edit-tx-note').value = note;

            openModal('modal-edit-tx');
        }

        async function saveEditTransaction(e) {
            e.preventDefault();
            const id = document.getElementById('edit-tx-id').value;
            const data = {
                card_id: document.getElementById('edit-tx-card').value,
                category_id: document.getElementById('edit-tx-category').value,
                transaction_date: document.getElementById('edit-tx-date').value,
                amount: Math.floor(parseInt(document.getElementById('edit-tx-amount').value)),
                note: document.getElementById('edit-tx-note').value
            };

            const { error } = await supabaseClient.from('card_transactions').update(data).eq('id', id);
            if (error) alert("更新失敗: " + error.message);
            else {
                closeModal('modal-edit-tx');
                if (currentDetailCardId) showCardAllTransactions(currentDetailCardId);
                if (!document.getElementById('view-stats').classList.contains('hidden')) generateStats();
            }
        }

        async function deleteTransaction(txId) {
            if (confirm('確定刪除這筆消費記錄？')) {
                const { error } = await supabaseClient.from('card_transactions').delete().eq('id', txId);
                if (error) alert("刪除失敗: " + error.message);
                else {
                    if (currentDetailCardId) showCardAllTransactions(currentDetailCardId);
                    if (!document.getElementById('view-stats').classList.contains('hidden')) generateStats();
                }
            }
        }

        // --- 統計報表邏輯 ---
        function getMonthlyCycle(card, today) {
            let bDay = card.billing_day;
            let currentMonthBill = today.date(bDay);
            let start, end;

            if (today.date() <= bDay) {
                end = currentMonthBill;
                start = end.subtract(1, 'month').add(1, 'day');
            } else {
                start = currentMonthBill.add(1, 'day');
                end = start.add(1, 'month').date(bDay);
            }
            return { start, end };
        }

        function getAnnualCycle(card, today) {
            let issueDate = dayjs(card.issue_date);
            let annivThisYear = today.month(issueDate.month()).date(issueDate.date());
            let start, end;
            
            if (today.isBefore(annivThisYear)) {
                start = annivThisYear.subtract(1, 'year');
                end = annivThisYear.subtract(1, 'day');
            } else {
                start = annivThisYear;
                end = annivThisYear.add(1, 'year').subtract(1, 'day');
            }
            return { start, end };
        }

        async function generateStats() {
            const container = document.getElementById('stats-container');
            container.innerHTML = '<p class="text-center text-gray-500 py-4">正在載入並計算資料...</p>';

            // 本期明細日期由舊到新
            const { data: txs } = await supabaseClient.from('card_transactions').select(`
                *,
                card_categories(category_name)
            `).order('transaction_date', { ascending: true });

            let html = '';
            let grandTotalMonthly = 0;
            let grandTotalAnnual = 0; // 當年度總花費
            
            let categoryTotalsMonthly = {};
            let categoryTotalsAnnual = {}; // 當年度分類總計
            
            const today = dayjs().tz();
            const currentYear = today.year();
            
            // 嚴格定義「當前日曆年度」 (例如：2026-01-01 00:00:00 ~ 2026-12-31 23:59:59)
            const calYearStart = today.startOf('year');
            const calYearEnd = today.endOf('year');

            // --- 全局：當年度 (Calendar Year) 計算 ---
            let calendarYearTxs = (txs || []).filter(t => dayjs(t.transaction_date).isBetween(calYearStart, calYearEnd, 'day', '[]'));
            calendarYearTxs.forEach(t => {
                grandTotalAnnual += t.amount;
                let catName = t.card_categories ? t.card_categories.category_name : '未分類';
                categoryTotalsAnnual[catName] = (categoryTotalsAnnual[catName] || 0) + t.amount;
            });

            // --- 個別卡片：結帳週期與發卡日週期 計算 ---
            for (let card of cards) {
                let mCycle = getMonthlyCycle(card, today);
                let aCycle = getAnnualCycle(card, today); // 依發卡日，為了算免年費次數保留

                let cardTxs = (txs || []).filter(t => t.card_id === card.id);

                let monthTxs = cardTxs.filter(t => dayjs(t.transaction_date).isBetween(mCycle.start, mCycle.end, 'day', '[]'));
                let monthSum = 0;
                
                // 計算單月總額並累加類別統計
                monthTxs.forEach(t => {
                    monthSum += t.amount;
                    let catName = t.card_categories ? t.card_categories.category_name : '未分類';
                    categoryTotalsMonthly[catName] = (categoryTotalsMonthly[catName] || 0) + t.amount;
                });
                
                grandTotalMonthly += monthSum;

                let annualTxs = cardTxs.filter(t => dayjs(t.transaction_date).isBetween(aCycle.start, aCycle.end, 'day', '[]'));
                let annualSum = annualTxs.reduce((sum, t) => sum + t.amount, 0);
                let annualCount = annualTxs.length;

                html += `
                    <div class="bg-white p-5 rounded shadow border-l-4 border-blue-500 mb-6">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-end mb-4 border-b pb-2 gap-2">
                            <div>
                                <h3 class="text-xl font-bold text-gray-800">${card.card_name} <span class="text-sm font-normal text-gray-500">(${card.card_number || '無卡號'})</span></h3>
                                <p class="text-xs text-gray-500 mt-1">結帳日: 每月 ${card.billing_day} 日 | 繳費日: 每月 ${card.payment_due_day} 日</p>
                            </div>
                            <button onclick="showCardAllTransactions('${card.id}')" class="bg-blue-600 text-white text-xs px-3 py-2 rounded hover:bg-blue-700 font-bold flex items-center gap-1 shadow-sm">
                                🔍 查看/管理所有歷史明細
                            </button>
                        </div>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                            <div class="bg-blue-50 p-3 rounded">
                                <p class="text-xs text-blue-600 font-bold mb-1">本月週期 (${mCycle.start.format('YYYY/MM/DD')} ~ ${mCycle.end.format('YYYY/MM/DD')})</p>
                                <p class="text-2xl font-bold text-gray-800">${formatMoney(monthSum)}</p>
                            </div>
                            <div class="bg-green-50 p-3 rounded border border-green-100">
                                <p class="text-xs text-green-600 font-bold mb-1">免年費計算區間 (依發卡日推算)</p>
                                <p class="text-xs text-gray-500 mb-2">(${aCycle.start.format('YYYY/MM/DD')} ~ ${aCycle.end.format('YYYY/MM/DD')})</p>
                                <div class="flex justify-between">
                                    <p class="text-xl font-bold text-gray-800">${formatMoney(annualSum)}</p>
                                    <p class="text-sm mt-1 font-bold text-gray-600">刷卡次數: ${annualCount} 次</p>
                                </div>
                            </div>
                        </div>

                        <h4 class="text-sm font-bold mb-2 text-gray-600">本期消費明細 (當月週期)</h4>
                        <div class="overflow-x-auto">
                            <table class="w-full text-sm text-left">
                                <thead class="bg-gray-100 text-gray-600">
                                    <tr>
                                        <th class="p-2">日期</th>
                                        <th class="p-2">地點/類別</th>
                                        <th class="p-2 text-right">金額</th>
                                        <th class="p-2">備註</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${monthTxs.length === 0 ? '<tr><td colspan="4" class="p-2 text-center text-gray-400">本期無消費紀錄</td></tr>' : 
                                      monthTxs.map(t => `
                                        <tr class="border-b">
                                            <td class="p-2">${t.transaction_date}</td>
                                            <td class="p-2">${t.card_categories ? t.card_categories.category_name : '未分類'}</td>
                                            <td class="p-2 text-right font-bold text-red-500">${formatMoney(t.amount)}</td>
                                            <td class="p-2 text-gray-500">${t.note || ''}</td>
                                        </tr>
                                      `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            }

            // 將類別物件轉為陣列並依照金額從大到小排序
            const sortedMonthlyCats = Object.entries(categoryTotalsMonthly).sort((a, b) => b[1] - a[1]);
            const sortedAnnualCats = Object.entries(categoryTotalsAnnual).sort((a, b) => b[1] - a[1]);

            // 類別統計區塊 HTML
            const categoryStatsHtml = `
                <div class="bg-white p-5 rounded shadow mb-6 border-t-4 border-purple-500">
                    <h3 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2">消費地點統計 (全部卡片加總)</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- 當月週期類別 -->
                        <div>
                            <h4 class="text-sm font-bold text-blue-600 mb-3">當月週期分類總計</h4>
                            <div class="space-y-2">
                                ${sortedMonthlyCats.length === 0 ? '<p class="text-sm text-gray-400">尚無資料</p>' : 
                                  sortedMonthlyCats.map(([name, amt]) => `
                                    <div class="flex justify-between items-center text-sm p-2 bg-gray-50 rounded">
                                        <span class="text-gray-700">${name}</span>
                                        <span class="font-bold text-gray-800">${formatMoney(amt)}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                        <!-- 年度週期類別 -->
                        <div>
                            <h4 class="text-sm font-bold text-green-600 mb-3">當年度分類總計 (${currentYear}年)</h4>
                            <div class="space-y-2">
                                ${sortedAnnualCats.length === 0 ? '<p class="text-sm text-gray-400">尚無資料</p>' : 
                                  sortedAnnualCats.map(([name, amt]) => `
                                    <div class="flex justify-between items-center text-sm p-2 bg-gray-50 rounded">
                                        <span class="text-gray-700">${name}</span>
                                        <span class="font-bold text-gray-800">${formatMoney(amt)}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;

            // 頂部大字總金額
            const summaryHtml = `
                <div class="bg-gray-800 text-white p-6 rounded shadow mb-6 flex flex-col md:flex-row justify-around text-center gap-4">
                    <div>
                        <p class="text-sm text-gray-300">全部卡號 - 當月總應繳金額</p>
                        <p class="text-3xl font-bold text-yellow-400">${formatMoney(grandTotalMonthly)}</p>
                    </div>
                    <div>
                        <p class="text-sm text-gray-300">全部卡號 - 當年度總消費金額 (${currentYear}年)</p>
                        <p class="text-3xl font-bold">${formatMoney(grandTotalAnnual)}</p>
                    </div>
                </div>
            `;

            container.innerHTML = summaryHtml + categoryStatsHtml + html;
        }

        // 初始化
        checkSession();
    </script>
</body>
</html>
